<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>포근 마을</title>
<style>
  :root { --ink:#4a3b2a; --paper:#fff8e6; --accent:#f2a65a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#2b3a2e; font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; color:var(--ink); }
  #wrap { position:relative; width:min(100vw, calc(100vh * 1.5)); aspect-ratio:3/2; margin:0 auto; top:50%; transform:translateY(-50%); user-select:none; }
  canvas { width:100%; height:100%; display:block; border-radius:12px; }
  .pill { position:absolute; background:var(--paper); border:3px solid var(--ink); border-radius:999px; padding:4px 14px; font-weight:700; font-size:clamp(11px,1.8vw,18px); box-shadow:0 3px 0 rgba(0,0,0,.25); }
  #bells { left:12px; top:10px; }
  #clock { left:12px; top:46px; }
  #inv { position:absolute; right:12px; top:10px; background:var(--paper); border:3px solid var(--ink); border-radius:14px; padding:8px 12px; font-size:clamp(11px,1.7vw,16px); min-width:130px; box-shadow:0 3px 0 rgba(0,0,0,.25); }
  #inv b { display:block; margin-bottom:4px; }
  #inv div { display:flex; justify-content:space-between; gap:12px; }
  #tools { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); display:flex; gap:8px; }
  .tool { width:clamp(40px,7vw,64px); height:clamp(40px,7vw,64px); background:var(--paper); border:3px solid var(--ink); border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:clamp(18px,3.4vw,30px); position:relative; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.25); }
  .tool small { font-size:clamp(9px,1.2vw,12px); }
  .tool i { position:absolute; left:4px; top:0; font-size:11px; font-style:normal; opacity:.6; }
  .tool.on { background:var(--accent); transform:translateY(-6px); }
  #msg { position:absolute; left:50%; bottom:clamp(60px,10vw,92px); transform:translateX(-50%); max-width:80%; background:var(--paper); border:3px solid var(--ink); border-radius:16px; padding:10px 18px; font-size:clamp(13px,2vw,20px); font-weight:600; text-align:center; box-shadow:0 4px 0 rgba(0,0,0,.25); }
  #msg[hidden], #shop[hidden], #help[hidden], #gear[hidden], #rpg[hidden] { display:none; }
  #shop, #help, #gear { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:var(--paper); border:4px solid var(--ink); border-radius:20px; padding:18px 24px; min-width:min(86%,340px); box-shadow:0 6px 0 rgba(0,0,0,.3); font-size:clamp(13px,2vw,18px); }
  #shop h2, #help h2, #gear h2 { margin:0 0 10px; }
  #shop .row { display:flex; justify-content:space-between; padding:2px 0; }
  button { font:inherit; font-weight:700; background:var(--accent); color:var(--ink); border:3px solid var(--ink); border-radius:12px; padding:6px 14px; margin:8px 6px 0 0; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  #help p { margin:4px 0; }
  #shop, #gear { max-height:88%; overflow:auto; }
  #gear h3 { margin:10px 0 2px; }
  #shop h3 { margin:10px 0 2px; }
  #shop .row button { margin:0; padding:1px 10px; }
  #furn { position:absolute; left:12px; top:90px; background:var(--paper); border:3px solid var(--ink); border-radius:14px; padding:8px 10px; font-size:clamp(11px,1.6vw,15px); box-shadow:0 3px 0 rgba(0,0,0,.25); max-width:190px; }
  #furn[hidden] { display:none; }
  #furn .it { display:flex; justify-content:space-between; gap:10px; padding:2px 6px; border-radius:8px; cursor:pointer; }
  #furn .it.on { background:var(--accent); }
  #furn small { display:block; margin-top:6px; opacity:.75; line-height:1.35; }
  .g { padding:3px 8px; border-radius:8px; cursor:pointer; }
  .g:hover { background:rgba(0,0,0,.08); }
  .g small { display:block; font-weight:400; opacity:.85; }
  #rpg { position:absolute; left:12px; bottom:10px; width:min(260px,34%); font-size:clamp(10px,1.4vw,13px); background:rgba(255,248,230,.94); border:3px solid var(--ink); border-radius:14px; padding:8px 10px; box-shadow:0 3px 0 rgba(0,0,0,.25); }
  #rpg .bar { position:relative; height:19px; background:#d8cdb8; border-radius:9px; overflow:hidden; margin-bottom:5px; border:2px solid var(--ink); }
  #rpg .bar i { position:absolute; left:0; top:0; bottom:0; }
  #rpg .bar i.hp { background:#e04848; } #rpg .bar i.xp { background:#4a8fd6; }
  #rpg .bar span { position:absolute; inset:0; text-align:center; line-height:15px; font-weight:700; color:#fff; text-shadow:0 0 3px #000,0 0 3px #000; }
  #rpg .sk { margin:2px 0; line-height:1.5; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="bells" class="pill"></div>
  <div id="clock" class="pill"></div>
  <div id="inv"></div>
  <div id="tools"></div>
  <div id="furn" hidden></div>
  <div id="rpg" hidden></div>
  <div id="gear" hidden></div>
  <div id="msg" hidden></div>
  <div id="shop" hidden></div>
  <div id="help">
    <h2>🌳 포근 마을에 오신 걸 환영해요</h2>
    <p>이동: 방향키 / WASD</p>
    <p>행동: 스페이스 또는 Z</p>
    <p>도구 선택: 1~5 (손·잠자리채·낚싯대·삽·묘목)</p>
    <p>T: 시간 빨리감기 (낮/밤 구경용)</p>
    <p>🏠 집 문 앞에서 스페이스 → 실내 꾸미기 (가구는 상점에서 구매)</p>
    <p>⛰️ 오른쪽 위 던전 입구: Q 회전베기 · E 구르기 · F 물약 · I 장비창</p>
    <p>🏪 상점에서 열매·물고기·곤충을 팔고 묘목을 사 보세요!</p>
    <button id="start">시작하기</button>
  </div>
</div>

<script>
"use strict";
/* ---------- 상수 / 데이터 ---------- */
const T = 32, W = 30, H = 20, VW = W * T, VH = H * T;
const HOUSE = { x: 3, y: 3, w: 3, h: 2 };
const SHOP  = { x: 13, y: 3, w: 3, h: 2 };
const CAP = 30;

const ITEMS = {
  apple:    { e: "🍎", n: "사과", p: 50 },
  orange:   { e: "🍊", n: "오렌지", p: 50 },
  peach:    { e: "🍑", n: "복숭아", p: 80 },
  flower:   { e: "🌷", n: "꽃", p: 30 },
  crucian:  { e: "🐟", n: "붕어", p: 100 },
  tropical: { e: "🐠", n: "열대어", p: 250 },
  puffer:   { e: "🐡", n: "복어", p: 400 },
  shark:    { e: "🦈", n: "상어", p: 1500 },
  boot:     { e: "🥾", n: "낡은 장화", p: 10 },
  butterfly:{ e: "🦋", n: "나비", p: 80 },
  firefly:  { e: "✨", n: "반딧불이", p: 150 },
  fossil:   { e: "🦴", n: "화석", p: 500 },
  shell:    { e: "🐚", n: "조개", p: 60 },
  sapling:  { e: "🌱", n: "묘목", p: 0 },
};
const DW = 48, DH = 32, BAGCAP = 20;
const CAVE = { x: 26, y: 2, w: 2, h: 2 };
const RARITY = [{ n: "일반", c: "#eeeeee", m: 1 }, { n: "마법", c: "#6fa8ff", m: 1.5 }, { n: "희귀", c: "#ffd34d", m: 2.3 }, { n: "전설", c: "#ff8a2b", m: 3.5 }];
const RD = ["#555", "#2b6fd6", "#b8860b", "#d2691e"];      // 밝은 종이 배경용
const SLOTS = {
  weapon: { n: "무기", es: ["🗡️", "🪓", "🔨"], base: ["검", "도끼", "망치"] },
  armor:  { n: "방어구", es: ["🛡️", "🥋"], base: ["방패", "갑옷"] },
  ring:   { n: "반지", es: ["💍"], base: ["반지"] },
};
const MPRE = ["예리한", "튼튼한", "날랜", "빛나는"], RPRE = ["용사의", "그림자", "폭풍의", "태양의"];
const LEG = { weapon: ["포근 마을의 수호검", "달빛 도끼", "풍요의 망치"], armor: ["다람쥐 장군의 갑옷", "숲의 수호 방패"], ring: ["별빛 반지", "행운의 인장"] };
const AFFIX = [
  { k: "dmg", f: l => 2 + l * 1.2 }, { k: "hp", f: l => 10 + l * 5 }, { k: "armor", f: l => 2 + l * 1.4 },
  { k: "crit", f: l => 2 + l * .4 }, { k: "as", f: l => 3 + l * .5 }, { k: "ms", f: l => 3 + l * .3 }, { k: "ls", f: l => 1 + l * .15 },
];
const MONS = [
  { e: "🐀", n: "쥐", hp: 22, dmg: 5, spd: 75, xp: 6 }, { e: "🦇", n: "박쥐", hp: 16, dmg: 6, spd: 115, xp: 7 },
  { e: "🕷️", n: "거미", hp: 30, dmg: 8, spd: 85, xp: 9 }, { e: "💀", n: "해골", hp: 48, dmg: 10, spd: 62, xp: 12 },
  { e: "🧟", n: "좀비", hp: 80, dmg: 13, spd: 48, xp: 16 }, { e: "👹", n: "도깨비", hp: 130, dmg: 18, spd: 66, xp: 26 },
];
const ri = n => Math.random() * n | 0;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let uidN = Date.now(); const uid = () => ++uidN;
const RW = 12, RH = 8;           // 실내 크기(칸), 위 2줄은 벽
const FURN = {
  chair:  { e: "🪑", n: "의자", p: 150 },
  sofa:   { e: "🛋️", n: "소파", p: 350 },
  bed:    { e: "🛏️", n: "침대", p: 400 },
  tv:     { e: "📺", n: "TV", p: 500 },
  shelf:  { e: "📚", n: "책장", p: 300 },
  plant:  { e: "🪴", n: "화분", p: 100 },
  lamp:   { e: "💡", n: "램프", p: 90 },
  teddy:  { e: "🧸", n: "곰인형", p: 80 },
  piano:  { e: "🎹", n: "피아노", p: 800 },
  frame:  { e: "🖼️", n: "액자", p: 120, wall: true },
  clock:  { e: "🕰️", n: "벽시계", p: 200, wall: true },
  window: { e: "🪟", n: "창문", p: 160, wall: true },
  rugR:   { e: "🟥", n: "빨간 러그", p: 120, rug: "#d9534f" },
  rugB:   { e: "🟦", n: "파란 러그", p: 120, rug: "#4a8fd6" },
};
const FRUITS = ["apple", "orange", "peach"];
const TOOLS = [
  { e: "🖐️", n: "손" }, { e: "🥅", n: "채" }, { e: "🎣", n: "낚시" },
  { e: "⛏️", n: "삽" }, { e: "🌱", n: "묘목" },
];
const VILLAGERS = [
  { name: "콩이", e: "🐶", lines: ["오늘도 산책하기 좋은 날이네요!", "저기 연못에서 큰 물고기를 봤어요.", "멍! 아, 말버릇이에요."] },
  { name: "나비", e: "🐱", lines: ["야옹~ 햇살이 따뜻해요.", "나무를 흔들면 열매가 떨어진대요.", "낮잠 자러 가야겠어요…"] },
  { name: "토리", e: "🐰", lines: ["깡총! 꽃이 정말 예쁘죠?", "묘목을 심으면 나무가 자라요.", "상점에 가면 벨을 벌 수 있어요."] },
  { name: "곰돌", e: "🐻", lines: ["으음… 배고프다.", "화석은 비싸게 팔린대요.", "밤에는 반딧불이가 나와요."] },
];

/* ---------- 유틸 ---------- */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
const rnd = mulberry32(20260506);          // 맵 생성용 (항상 같은 마을)
const R = Math.random;
const $ = id => document.getElementById(id);
const inRect = (r, x, y) => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h;

/* ---------- 맵 ---------- */
const terrain = [];
for (let y = 0; y < H; y++) { terrain[y] = []; for (let x = 0; x < W; x++) {
  const ex = (x - 22) / 6, ey = (y - 13) / 3.6;
  terrain[y][x] = ex * ex + ey * ey < 1 ? "w" : "g";
} }
for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (terrain[y][x] === "g") {
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) if (terrain[y + j]?.[x + i] === "w") terrain[y][x] = "s";
}
for (let x = 3; x <= 15; x++) terrain[5][x] = "p";
for (let y = 5; y <= 9; y++) terrain[y][8] = "p";

const flowers = [];   // {x,y,e,back}
const rocks = [];
const freeGrass = (x, y) => terrain[y]?.[x] === "g" && !inRect({x:HOUSE.x-1,y:HOUSE.y-1,w:HOUSE.w+2,h:HOUSE.h+3}, x, y) && !inRect({x:SHOP.x-1,y:SHOP.y-1,w:SHOP.w+2,h:SHOP.h+3}, x, y) && Math.hypot(x - 8, y - 8) > 2.5;
function scatter(n, fn) { let tries = 0; while (n > 0 && tries++ < 2000) { const x = rnd() * W | 0, y = rnd() * H | 0; if (freeGrass(x, y) && fn(x, y)) n--; } }
const seedTrees = [];
scatter(10, (x, y) => { if (seedTrees.some(t => Math.hypot(t.x - x, t.y - y) < 3)) return false; seedTrees.push({ x, y, age: 99, fruit: 3, kind: FRUITS[rnd() * 3 | 0], t: 0 }); return true; });
scatter(28, (x, y) => { if (seedTrees.some(t => t.x === x && t.y === y)) return false; flowers.push({ x, y, e: ["🌷", "🌼", "🌸", "🌺"][rnd() * 4 | 0], back: 0 }); return true; });
scatter(6, (x, y) => { if (seedTrees.some(t => t.x === x && t.y === y) || flowers.some(f => f.x === x && f.y === y)) return false; rocks.push({ x, y }); return true; });

/* ---------- 상태 / 저장 ---------- */
let S = { bells: 200, inv: { sapling: 1 }, trees: seedTrees, fin: { chair: 1, plant: 1 }, room: [] };
try { const raw = localStorage.getItem("pokgeun-maeul"); if (raw) S = JSON.parse(raw); } catch (e) {}
function save() { try { localStorage.setItem("pokgeun-maeul", JSON.stringify(S)); } catch (e) {} }
S.fin = S.fin || {}; S.room = S.room || [];
S.lv = S.lv || 1; S.xp = S.xp || 0; S.potions = S.potions ?? 2; S.bag = S.bag || []; S.best = S.best || 0;
S.eq = S.eq || { weapon: { id: 1, slot: "weapon", e: "🗡️", n: "나무 칼", rar: 0, ilvl: 1, st: { dmg: 3 }, price: 10 }, armor: null, ring: null };
const trees = S.trees;
let scene = "out", furnSel = null, dun = null;
(() => { const z = (x, y) => x >= 25 && x <= 28 && y >= 1 && y <= 5;
  for (let i = flowers.length - 1; i >= 0; i--) if (z(flowers[i].x, flowers[i].y)) flowers.splice(i, 1);
  for (let i = rocks.length - 1; i >= 0; i--) if (z(rocks[i].x, rocks[i].y)) rocks.splice(i, 1);
  for (let i = trees.length - 1; i >= 0; i--) if (z(trees[i].x, trees[i].y)) trees.splice(i, 1); })();
const ground = [];       // 바닥에 떨어진 아이템 {x,y,k}
const bugs = [];
let fishing = null;      // {tx,ty,state,t}
let modal = false, started = false, fast = false;
let clock = new Date().getHours() + new Date().getMinutes() / 60;
let vtime = 0, saveT = 0;

const player = { x: 8.5 * T, y: 8.5 * T, dx: 0, dy: 1, tool: 0, hp: 100, atkCd: 0, qCd: 0, eCd: 0, fCd: 0, dash: 0, inv: 0, flash: 0 };
const SPAWNS = [[11, 9], [13, 8], [5, 11], [12, 14]];
const villagers = VILLAGERS.map((v, i) => ({ ...v, x: (SPAWNS[i][0] + .5) * T, y: (SPAWNS[i][1] + .5) * T, vx: 0, vy: 0, t: 0, talk: 0, line: 0 }));

/* ---------- 충돌 ---------- */
const treeAt = (x, y) => trees.find(t => t.x === x && t.y === y);
const rockAt = (x, y) => rocks.find(r => r.x === x && r.y === y);
const flowerAt = (x, y) => flowers.find(f => f.x === x && f.y === y && !f.back);
function roomSolid(x, y) {
  if (y >= RH) return !(y === RH && (x === 5 || x === 6));   // 출입구
  if (x < 0 || x >= RW || y < 2) return true;
  return S.room.some(r => r.x === x && r.y === y && !FURN[r.id].rug && !FURN[r.id].wall);
}
function solidTile(x, y) {
  if (scene === "home") return roomSolid(x, y);
  if (scene === "dun") return x < 0 || y < 0 || x >= DW || y >= DH || dun.map[y][x] === "#";
  if (x < 0 || y < 0 || x >= W || y >= H) return true;
  return terrain[y][x] === "w" || inRect(HOUSE, x, y) || inRect(SHOP, x, y) || inRect(CAVE, x, y) || !!treeAt(x, y) || !!rockAt(x, y);
}
function blocked(cx, cy, hw, hh) {
  for (const [ox, oy] of [[-hw, -hh], [hw, -hh], [-hw, hh], [hw, hh]])
    if (solidTile(Math.floor((cx + ox) / T), Math.floor((cy + oy) / T))) return true;
  return false;
}

/* ---------- UI ---------- */
function obj(n) { const c = n.charCodeAt(n.length - 1) - 0xAC00; return n + (c >= 0 && c % 28 ? "을" : "를"); }
let msgTimer = 0;
function say(text, ms = 2600) {
  const m = $("msg"); m.textContent = text; m.hidden = false;
  clearTimeout(msgTimer); msgTimer = setTimeout(() => m.hidden = true, ms);
}
function count() { return Object.entries(S.inv).reduce((a, [k, v]) => a + (k === "sapling" ? 0 : v), 0); }
function add(id, n = 1) {
  if (id !== "sapling" && count() + n > CAP) { say("주머니가 가득 찼어요! 상점에서 팔아 보세요."); return false; }
  S.inv[id] = (S.inv[id] || 0) + n; hud(); return true;
}
function hud() {
  $("bells").textContent = `🔔 ${S.bells.toLocaleString()} 벨 · ⚔️ Lv.${S.lv}`;
  const rows = Object.entries(S.inv).filter(([, v]) => v > 0).map(([k, v]) => `<div><span>${ITEMS[k].e} ${ITEMS[k].n}</span><span>×${v}</span></div>`).join("");
  $("inv").innerHTML = `<b>🎒 주머니 ${count()}/${CAP}</b>${rows}<div><span>🧪 물약</span><span>×${S.potions}</span></div>`;
  renderFurn(); renderRpg();
  $("tools").style.display = scene === "dun" ? "none" : "flex";
  $("tools").innerHTML = TOOLS.map((t, i) => `<div class="tool ${i === player.tool ? "on" : ""}" data-i="${i}"><i>${i + 1}</i>${t.e}<small>${i === 4 ? "×" + (S.inv.sapling || 0) : t.n}</small></div>`).join("");
}
function renderFurn() {
  const el = $("furn");
  if (scene !== "home") { el.hidden = true; return; }
  const rows = Object.entries(S.fin).filter(([, v]) => v > 0);
  el.innerHTML = `<b>🛋️ 가구 (${S.room.length}개 배치)</b>` +
    (rows.map(([k, v]) => `<div class="it ${furnSel === k ? "on" : ""}" data-k="${k}"><span>${FURN[k].e} ${FURN[k].n}</span><span>×${v}</span></div>`).join("") || "<div>보유 가구가 없어요. 상점에서 사 보세요!</div>") +
    `<small>스페이스: 놓기/집기<br>X: 바라보는 가구 집기<br>선택 다시 클릭: 해제<br>아래 출구로 나가기</small>`;
  el.hidden = false;
}
$("furn").addEventListener("click", e => { const t = e.target.closest(".it"); if (t) { furnSel = furnSel === t.dataset.k ? null : t.dataset.k; renderFurn(); } });
$("tools").addEventListener("click", e => { const t = e.target.closest(".tool"); if (t) { player.tool = +t.dataset.i; cancelFish(); hud(); } });
function clockText() {
  const h = Math.floor(clock) % 24, m = Math.floor((clock % 1) * 60);

  if (f.wall) return (y === 0 || y === 1) && !here.some(r => FURN[r.id].wall);

function genDun(depth) {
  const map = Array.from({ length: DH }, () => Array(DW).fill("#")), rooms = [];
  for (let i = 0; i < 90 && rooms.length < 9; i++) {
    const w = 6 + ri(6), h = 5 + ri(5), x = 1 + ri(DW - w - 2), y = 1 + ri(DH - h - 2);
    if (rooms.some(r => x < r.x + r.w + 2 && x + w + 2 > r.x && y < r.y + r.h + 2 && y + h + 2 > r.y)) continue;
    rooms.push({ x, y, w, h });

  if (rooms.length < 4) return genDun(depth);
  for (const r of rooms) for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) map[y][x] = ".";
  const carve = (x, y) => { for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) { const xx = x + i, yy = y + j; if (xx > 0 && yy > 0 && xx < DW - 1 && yy < DH - 1) map[yy][xx] = "."; } };
  const c = r => [r.x + (r.w >> 1), r.y + (r.h >> 1)];
  for (let i = 1; i < rooms.length; i++) {
    let [x1, y1] = c(rooms[i - 1]); const [x2, y2] = c(rooms[i]);
    while (x1 !== x2) { carve(x1, y1); x1 += Math.sign(x2 - x1); }
    while (y1 !== y2) { carve(x1, y1); y1 += Math.sign(y2 - y1); }
    carve(x1, y1);
  }
  const [ex, ey] = c(rooms[0]), [sx, sy] = c(rooms[rooms.length - 1]);
  const d = { depth, map, mons: [], loot: [], fx: [], arcs: [], exit: { x: ex, y: ey }, stairs: { x: sx, y: sy } };
  for (let i = 1; i < rooms.length; i++) {
    const r = rooms[i], n = 2 + ri(3) + (depth / 3 | 0);
    for (let k = 0; k < n; k++) {
      const x = r.x + ri(r.w), y = r.y + ri(r.h);

      d.mons.push(mkMon(depth, (x + .5) * T, (y + .5) * T, false));

}

  ctx.fillStyle = "#8a5a35"; ctx.fillRect(5 * T, RH * T, 2 * T, 10);
  ctx.fillStyle = "#fff8e6"; ctx.font = "bold 12px sans-serif"; ctx.fillText("⬇ 출구", 6 * T, RH * T + 24);
  for (const r of S.room) if (FURN[r.id].rug) { ctx.fillStyle = FURN[r.id].rug; ctx.beginPath(); ctx.roundRect(r.x * T + 2, r.y * T + 2, T - 4, T - 4, 6); ctx.fill(); }
  const ents = [];
  for (const r of S.room) { const f = FURN[r.id]; if (f.rug) continue; ents.push({ y: f.wall ? 0 : (r.y + 1) * T, f: () => emoji(f.e, (r.x + .5) * T, (r.y + .55) * T, f.wall ? 26 : 30) }); }
  ents.push({ y: player.y + 14, f: () => emoji("🧒", player.x, player.y, 32) });
  ents.sort((a, b) => a.y - b.y).forEach(e => e.f());
  if (!modal) { const { tx, ty } = target(); ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 2; ctx.setLineDash([5, 4]); ctx.strokeRect(tx * T + 2, ty * T + 2, T - 4, T - 4); ctx.setLineDash([]); }
  ctx.restore();
}
function label(text, x, y) {
  ctx.font = "bold 12px sans-serif"; const w = ctx.measureText(text).width + 12;
  ctx.fillStyle = "rgba(255,248,230,.92)"; ctx.fillRect(x - w / 2, y - 9, w, 18);
  ctx.fillStyle = "#4a3b2a"; ctx.fillText(text, x, y);
}

/* ---------- 메인 루프 ---------- */
let last = performance.now(), hudT = 0, rpgT = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw();
  if ((hudT += dt) > .5) { hudT = 0; $("clock").textContent = clockText(); }
  if (scene === "dun" && (rpgT += dt) > .1) { rpgT = 0; renderRpg(); }
  requestAnimationFrame(frame);
}
player.hp = pstats().maxhp;
resize(); hud(); $("clock").textContent = clockText();
requestAnimationFrame(frame);
window.__game = { enterDungeon, get dun() { return dun; }, pstats, genGear, attack, scene: () => scene, furnSelSet: v => { furnSel = v; renderFurn(); }, player, trees, S, keys, act, get fishing() { return fishing; }, bugs, villagers }; // 디버그/테스트용
</script>
